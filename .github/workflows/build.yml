name: Build and Test

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build-win:
    runs-on: windows-2025
    strategy:
      fail-fast: false
    name: Windows
    timeout-minutes: 15
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
        submodules: recursive

    - name: 'Build vadc'
      shell: cmd
      run: build_msvc.bat 0
    - uses: actions/upload-artifact@v7
      with:
        name: vadc-${{ runner.os }}
        path: vadc.exe

  build-win-onnx:
    runs-on: windows-2025
    strategy:
      fail-fast: false
    name: Windows
    timeout-minutes: 15
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
        submodules: recursive

    - name: 'Build vadc'
      shell: cmd
      run: build_msvc.bat 1

    - name: 'Copy to release dir'
      shell: cmd
      run: |
        mkdir release_onnx
        xcopy /i /y vadc.exe release_onnx
        xcopy /i /y silero_vad_v3.onnx release_onnx
        xcopy /i /y silero_vad_v4.onnx release_onnx
        xcopy /i /y lib/onnxruntime.dll release_onnx
        xcopy /i /y lib/onnxruntime_providers_shared.dll release_onnx
    - uses: actions/upload-artifact@v7
      with:
        name: vadc-onnx-${{ runner.os }}
        path: release_onnx/

  release:
    needs: [build-win, build-win-onnx]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
